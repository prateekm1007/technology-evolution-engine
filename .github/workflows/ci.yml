name: Master Protocol Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Gate 1 — Read list check (5 files)
        run: python scripts/remember_governance.py

      - name: Gate 2 — Law 27 forbidden-language scan
        run: python scripts/enforce_law27.py

      - name: Gate 3 — Test suite
        run: python -m pytest tests/ -v --tb=short
