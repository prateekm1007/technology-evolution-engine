name: Master Protocol Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          pip install weasyprint markdown

      - name: Gate 1 — Read list check (5 files)
        run: python scripts/remember_governance.py

      - name: Gate 2 — Law 27 forbidden-language scan (repo)
        run: python scripts/enforce_law27.py

      - name: Gate 2.5 — Law 27 scan on the product source (Gap 7)
        run: python scripts/enforce_law27.py product/PRODUCT.md

      - name: Gate 2.75 — Independent recomputation verifier (Phase 1)
        run: python scripts/verify_arithmetic.py product/PRODUCT.md

      - name: Gate 3 — 1D thermal model runs (Gap 5)
        run: python scripts/thermal_model_1d.py

      - name: Gate 4 — Regenerate PDF from source and verify match (Gap 1, 8)
        run: |
          python scripts/generate_pdf.py product/PRODUCT.md /tmp/PRODUCT_regenerated.pdf
          if ! cmp -s product/PRODUCT.pdf /tmp/PRODUCT_regenerated.pdf; then
            echo "FAIL: product/PRODUCT.pdf does not match regenerated PDF from product/PRODUCT.md"
            echo "The committed PDF is stale. Run: python scripts/generate_pdf.py product/PRODUCT.md product/PRODUCT.pdf"
            exit 1
          fi
          echo "PASS: product/PRODUCT.pdf matches regenerated PDF from source"

      - name: Gate 5 — Test suite (fast, excludes slow)
        run: python -m pytest tests/ -v --tb=short -m "not slow"

      - name: Gate 5b — Slow validation tests (5-seed × 4-domain 4/4 enforcement)
        run: python -m pytest tests/test_meta_invention.py::test_meta_invention_full_5seed_4of4 -v --tb=short

      - name: Gate 5c — Multi-seed comparative (5 seeds × 20 problems, stable wins ≥7)
        run: python -m pytest tests/test_multi_seed_comparative.py::test_multi_seed_stable_wins_at_least_7 -v --tb=short

      - name: Gate 5d — Multi-seed strong baselines (5 seeds × 20 problems, stable wins ≥5 vs CMA-ES/GP-BO)
        run: python -m pytest tests/test_strong_baselines_v2.py::test_multi_seed_strong_stable_wins_at_least_5 -v --tb=short

      - name: Gate 6 — Law 14: Foundation Continuity check
        run: python scripts/check_continuity.py

      - name: Gate 7 — DR-11: Phantom-Work detection
        run: python scripts/check_phantom_work.py

      - name: Gate 8 — DR-7: Formula execution verifier
        run: python scripts/verify_formulas.py --json || true  # warnings OK, failures should be fixed

      - name: Gate 9 — Prose consistency linter (DR-9)
        run: python scripts/verify_prose_consistency.py product/PRODUCT.md || true  # warnings OK

      - name: Gate 10 — Governance CI gates (P1, P27, P70, P77, FA2, GOV, TAX)
        run: python scripts/ci_gates.py
